services:
  mongodb-service:
    image: mongo:latest
    restart: always


    volumes:
      - mongo-data:/data/db
      - ./install/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  backend-service:
    image: ghcr.io/joaovictor-m/testflow-backend:latest
    restart: always
    expose:
      - "3000"
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost/testflow}
    volumes:
      - ./evidencias_testes:/evidencias_testes
    depends_on:
      - mongodb-service

  frontend-service:
    image: ghcr.io/joaovictor-m/testflow-frontend:latest
    restart: always
    expose:
      - "80"
    depends_on:
      - backend-service

  nginx-service:
    image: ghcr.io/joaovictor-m/testflow-nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-service
      - backend-service
    volumes:
      - ./certificados:/etc/nginx/ssl:ro

volumes:
  mongo-data:
